<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Code - Diamond Link Tech Support</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .claude-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.claude {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-bottom-right-radius: 18px;
            border-bottom-left-radius: 4px;
        }

        .message.claude .message-content {
            background: white;
            color: #333;
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 4px;
        }

        .input-container {
            padding: 20px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e1e5e8;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-field:focus {
            border-color: #667eea;
        }

        .send-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s ease;
        }

        .send-btn:hover {
            transform: translateY(-2px);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .status {
            padding: 10px 20px;
            font-size: 12px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
        }

        .status-dot.connecting {
            background: #ff9800;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .quick-actions {
            padding: 15px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .project-info {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            font-size: 11px;
            color: #666;
        }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #667eea;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
            
            .main-content {
                height: 100%;
            }
            
            .message-content {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="header">
                <h1>
                    <div class="claude-icon">C</div>
                    Claude Code
                </h1>
            </div>
            
            <div class="project-info">
                <strong>🦷 Diamond Link</strong><br>
                Dental Clinic Management<br>
                Tech Support Mode
            </div>
            
            <div class="quick-actions">
                <button class="action-btn" onclick="setAgent('tech-support')">
                    🛠 Tech Support
                </button>
                <button class="action-btn" onclick="setAgent('code-reviewer')">
                    🔍 Code Reviewer
                </button>
                <button class="action-btn" onclick="setAgent('debugger')">
                    🐛 Debugger
                </button>
                <button class="action-btn" onclick="clearChat()">
                    🗑️ Clear Chat
                </button>
            </div>
        </div>
        
        <div class="main-content">
            <div class="header">
                <h1>Claude Code Interface</h1>
                <div class="status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Ready</span>
                </div>
            </div>
            
            <div class="chat-container">
                <div class="messages" id="messages"></div>
                
                <div class="input-container">
                    <div class="input-wrapper">
                        <input 
                            type="text" 
                            id="messageInput" 
                            class="input-field" 
                            placeholder="Ask Claude Code about Diamond Link..."
                            onkeypress="handleKeyPress(event)"
                            disabled
                        >
                        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
                            Send
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentAgent = 'tech-support';
        let isConnected = false;
        let messageHistory = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            updateStatus('Ready', 'connected');
            loadMessageHistory();
            document.getElementById('messageInput').disabled = false;
            document.getElementById('sendBtn').disabled = false;
        });

        function setAgent(agent) {
            currentAgent = agent;
            updateAgentButtons();
            addMessage('system', `Switched to ${agent} agent`);
        }

        function updateAgentButtons() {
            document.querySelectorAll('.action-btn').forEach(btn => {
                btn.style.background = 'rgba(255, 255, 255, 0.1)';
                btn.style.transform = 'translateY(0)';
            });
            
            const activeBtn = Array.from(document.querySelectorAll('.action-btn')).find(
                btn => btn.textContent.toLowerCase().includes(currentAgent.replace('-', ''))
            );
            if (activeBtn) {
                activeBtn.style.background = 'linear-gradient(135deg, #667eea, #764ba2)';
            }
        }

        function updateStatus(text, status = 'connected') {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            
            statusDot.className = `status-dot ${status}`;
            statusText.textContent = text;
        }

        function addMessage(type, content) {
            const messagesContainer = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.textContent = content;
            
            messageDiv.appendChild(contentDiv);
            messagesContainer.appendChild(messageDiv);
            
            // Save to history
            messageHistory.push({ type, content, timestamp: new Date().toISOString() });
            saveMessageHistory();
            
            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Add user message
            addMessage('user', message);
            
            // Clear input
            input.value = '';
            
            // Send to Claude Code
            sendToClaude(message);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                sendMessage();
            }
        }

        async function sendToClaude(message) {
            updateStatus('Sending...', 'connecting');
            
            try {
                const response = await fetch('/api/claude-chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        agent: currentAgent,
                        project: 'diamond-link'
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const result = await response.json();
                
                if (result.response) {
                    addMessage('claude', result.response);
                } else {
                    addMessage('claude', 'Sorry, I encountered an error processing your request.');
                }
                
                updateStatus('Ready', 'connected');
            } catch (error) {
                console.error('Error sending to Claude:', error);
                addMessage('claude', `Error: ${error.message}`);
                updateStatus('Error', 'connecting');
            }
        }

        function clearChat() {
            document.getElementById('messages').innerHTML = '';
            messageHistory = [];
            saveMessageHistory();
        }

        function saveMessageHistory() {
            localStorage.setItem('claude-chat-history', JSON.stringify(messageHistory));
        }

        function loadMessageHistory() {
            const saved = localStorage.getItem('claude-chat-history');
            if (saved) {
                messageHistory = JSON.parse(saved);
                messageHistory.forEach(msg => {
                    addMessage(msg.type, msg.content);
                });
            }
        }
    </script>
</body>
</html>
